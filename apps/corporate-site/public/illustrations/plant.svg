<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="plant-title plant-desc">
  <title id="plant-title">Abstract industrial plant diagram</title>
  <desc id="plant-desc">A schematic illustration of silos, process equipment, piping, and a control gauge.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2e8f0" stroke-width="1" />
    </pattern>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff" />
      <stop offset="1" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="reactor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdfa" />
      <stop offset="1" stop-color="#99f6e4" />
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4338ca" />
      <stop offset="0.6" stop-color="#0f766e" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#f8fafc" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <g stroke="#94a3b8" stroke-width="2">
    <path d="M80 566H1120" />
    <path d="M80 560v12M1120 560v12" />
  </g>

  <g>
    <rect x="160" y="258" width="124" height="308" rx="14" fill="url(#tank)" stroke="#4338ca" stroke-width="3" />
    <ellipse cx="222" cy="258" rx="62" ry="14" fill="#eef2ff" stroke="#4338ca" stroke-width="3" />
    <path d="M164 330h116M164 400h116M164 470h116" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 8" />
    <path d="M222 244v-34" stroke="#4338ca" stroke-width="3" />
    <circle cx="222" cy="204" r="7" fill="#4338ca" />
  </g>

  <g>
    <rect x="340" y="300" width="124" height="266" rx="14" fill="url(#tank)" stroke="#4338ca" stroke-width="3" />
    <ellipse cx="402" cy="300" rx="62" ry="14" fill="#eef2ff" stroke="#4338ca" stroke-width="3" />
    <path d="M344 366h116M344 432h116M344 498h116" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 8" />
    <path d="M402 286v-26" stroke="#4338ca" stroke-width="3" />
    <circle cx="402" cy="254" r="7" fill="#4338ca" />
  </g>

  <g fill="none" stroke="url(#pipe)" stroke-width="8" stroke-linecap="round">
    <path d="M284 480h56" />
    <path d="M464 480h96l40-84" />
    <path d="M600 396h64" />
  </g>
  <g fill="#0f766e">
    <circle cx="340" cy="480" r="10" />
    <circle cx="600" cy="396" r="10" />
  </g>

  <g>
    <rect x="664" y="292" width="220" height="274" rx="22" fill="url(#reactor)" stroke="#0f766e" stroke-width="3" />
    <path d="M700 340h148M700 384h148M700 428h148" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 8" />
    <rect x="718" y="466" width="112" height="70" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="2" />
    <path d="M736 492h76M736 510h52" stroke="#0f766e" stroke-width="3" stroke-linecap="round" />
    <path d="M884 340h52" stroke="#0f766e" stroke-width="3" />
    <circle cx="936" cy="340" r="7" fill="#0f766e" />
  </g>

  <g fill="none" stroke="#b45309" stroke-width="3">
    <path d="M936 340h92v126" />
    <path d="M1000 466h94" />
  </g>
  <g fill="#b45309">
    <circle cx="1028" cy="466" r="9" />
  </g>

  <g>
    <circle cx="1008" cy="220" r="76" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
    <path d="M1008 220l34-34" stroke="#4338ca" stroke-width="5" stroke-linecap="round" />
    <circle cx="1008" cy="220" r="8" fill="#4338ca" />
    <g stroke="#94a3b8" stroke-width="2">
      <path d="M1008 150v14M1078 220h-14M1008 290v-14M938 220h14" />
      <path d="M1055 173l-10 10M1055 267l-10-10M961 267l10-10M961 173l10 10" />
    </g>
    <path d="M959 259a62 62 0 0 1 98 0" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" />
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M160 612h188" />
    <path d="M664 612h220" />
    <path d="M936 612h92" />
  </g>

  <g fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="3">
    <text x="160" y="645">INTAKE</text>
    <text x="664" y="645">PROCESS</text>
    <text x="936" y="645">OUTPUT</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 8">
    <path d="M120 258h-32M120 566h-32" />
    <path d="M1080 220h32M1080 466h32" />
  </g>
</svg>
